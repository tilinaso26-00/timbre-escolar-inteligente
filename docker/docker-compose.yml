version: '3.8'

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - VITE_WS_URL=ws://localhost:81
    stdin_open: true
    tty: true

  firmware:
    build:
      context: ./firmware
      dockerfile: Dockerfile
    volumes:
      - ./firmware:/firmware
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    environment:
      - PLATFORMIO_UPLOAD_PORT=/dev/ttyUSB0

networks:
  default:
    name: timbre-network