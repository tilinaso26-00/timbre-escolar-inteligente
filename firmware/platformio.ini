[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    me-no-dev/ESPAsyncWebServer@^3.4.1
    arduino-libraries/NTPClient@^3.2.1
    adafruit/RTClib@^2.1.4
    links2004/WebSockets@^2.3.6

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DASYNC_TCP_SSL_ENABLED=0
    ; El sync completo (2 jornadas + plantillas) ronda los 25 KB; el default de
    ; la lib WebSockets (15 KB) desconecta al cliente con close 1009. Requiere
    ; que WebSockets.h proteja su #define con #ifndef (patch en .pio/libdeps).
    -DWEBSOCKETS_MAX_DATA_SIZE=65536

board_build.partitions = default.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio

; Subida por USB/serial por defecto (el ESP32 seflashea sin red).
; Para OTA usar: pio run -e esp32dev-ota -t upload

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.100
build_flags = ${env:esp32dev.build_flags} -DARDUINO_OTA_ENABLED=1