[package]
name = "timbre-escolar"
version = "1.0.0"
description = "Timbre Escolar Inteligente - Sistema de automatización de timbres escolares"
authors = ["Timbre Escolar Team"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "timbre_escolar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["default"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
tauri-plugin-clipboard = "2"
tauri-plugin-store = "2"
tokio = { version = "1.38", features = ["full", "macros"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["native-tls", "rustls-native-certs"] }
serialport = { version = "4", features = [] }
tokio-serial = "4"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
debug = 2
